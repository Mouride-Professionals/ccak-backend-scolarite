memory_limit=512M
upload_max_filesize=10M
post_max_size=12M
max_execution_time=120
date.timezone=UTC
expose_php=Off

; CVE-2026-109619 (RCE via stale global state): session upload progress is one of
; the two FPM entry points the advisory documents, and it is on by default. Laravel
; never uses PHP's native sessions, so it serves nothing here — off as defence in
; depth. The actual fix is the patched PHP base image pinned in the Dockerfile.
session.upload_progress.enabled = 0
